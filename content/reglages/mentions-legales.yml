titre: Mentions légales et confidentialité
texte: |-
  ## Éditeur

  Laboratoire de Psychologie Clinique, de Psychopathologie et de Psychanalyse (LPCPP, UR 3278), Aix-Marseille Université\
  Maison de la Recherche, 29 avenue Robert Schuman, 13621 Aix-en-Provence Cedex 01

  Directrice de la publication : Victoria Isabel Fernandez

  Contact : [pi-universite@proton.me](mailto:pi-universite@proton.me)

  ## Hébergement

  Cloudflare, Inc., 101 Townsend Street, San Francisco, CA 94107, États-Unis\
  Téléphone : +1 888 993 5273

  ## Données personnelles

  Ce site ne dépose aucun cookie et n'utilise aucun outil de mesure d'audience.

  L'inscription à la newsletter recueille votre adresse e-mail, avec votre consentement, dans le seul but de vous envoyer la newsletter du site. Le responsable du traitement est l'éditeur ci-dessus. Les adresses sont gérées par Brevo (Sendinblue SAS, Paris), qui agit pour son compte, et conservées jusqu'à votre désinscription.

  Vous pouvez vous désinscrire à tout moment grâce au lien présent dans chaque e-mail. Conformément au règlement général sur la protection des données (RGPD), vous disposez d'un droit d'accès, de rectification et d'effacement de vos données : écrivez à [pi-universite@proton.me](mailto:pi-universite@proton.me). Vous pouvez aussi adresser une réclamation à la CNIL ([cnil.fr](https://www.cnil.fr)).
