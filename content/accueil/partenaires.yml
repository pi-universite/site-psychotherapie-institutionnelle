        bio: Tudi GOZE est psychiatre et docteur en philosophie, il est Maître de Conférences des Universités et Praticien Hospitalier à l'Université de Toulouse (ERRAPHIS EA 3051) et exerce au Centre Hospitalier Lavaur. Spécialiste de phénoménologie contemporaine, de psychopathologie des psychoses et de psychothérapie institutionnelle. Il est l'auteur de Phénoménologie et Schizophrénie (Hermann, 2024) et Expérience de la rencontre schizophrénique (Hermann, 2020).
