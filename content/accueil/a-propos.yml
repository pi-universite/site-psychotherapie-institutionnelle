titre: À propos
texte: |-
  En octobre 2025, à Marseille, s'est tenu un colloque consacré à la psychothérapie institutionnelle (PI), coporté par cinq laboratoires de recherche universitaires. Cette rencontre a réuni un nombre important d'enseignant·es-chercheur·ses, de jeunes chercheur·ses, de professionnel·les et un public varié, témoignant de la vitalité actuelle de ce champ — souvent défini par son hétérogénéité même.

  Le colloque a exploré quatre axes : l'histoire de la PI, la pluralité de ses pratiques et leur transmission, ses dialogues théoriques avec d'autres disciplines, et les usages de son épistémologie hors du champ clinique — dans l'accueil et l'hospitalité au sens large. Il a aussi interrogé l'université elle-même comme lieu pour ce champ de recherche, et comme institution que la PI peut à son tour éclairer.

  De ces échanges est né un constat : la nécessité de mettre en réseau les initiatives de recherche sur la PI, aujourd'hui dispersées entre universités, laboratoires et disciplines. Ce site prolonge cette dynamique : une interface appelée à s'enrichir dans le temps, pour repérer plus facilement qui travaille sur ces questions, où, et avec quels projets — et pour faciliter les rencontres à venir ; mais aussi rendre disponibles des ressources — permettant de trouver facilement des ressources textuelles et multimédias sur l'histoire et l'actualité de la recherche en psychothérapie institutionnelle.
