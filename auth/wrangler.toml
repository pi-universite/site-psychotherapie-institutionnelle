# Cloudflare Worker: GitHub OAuth client for this site's Sveltia CMS.
# Deployed once by hand (`npx wrangler deploy` from this folder), not by the
# Pages build. See README → « Connexion GitHub (Worker OAuth) ».
name = "cms-auth"
# Client's Cloudflare account (pi-universite), so a deploy never lands on another account.
account_id = "ef97763f13979f4d652569f72e55e7cf"
main = "src/index.ts"
# Frozen on purpose: Cloudflare keeps old compatibility dates working forever.
compatibility_date = "2025-09-01"
workers_dev = true

[vars]
# Exact origins (scheme + host, no trailing slash) allowed to receive tokens.
ALLOWED_ORIGINS = "https://psychotherapie-institutionnelle-universite.pages.dev,http://localhost:4321"
# "public_repo" if the repository is public, "repo" if it is private.
OAUTH_SCOPE = "public_repo"

# Secrets (never committed), set once with:
#   npx wrangler secret put GITHUB_CLIENT_ID
#   npx wrangler secret put GITHUB_CLIENT_SECRET
#   npx wrangler secret put STATE_SECRET   (openssl rand -hex 32)
